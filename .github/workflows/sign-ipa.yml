
name: Sign iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the unsigned .ipa"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-ipa-signing
  cancel-in-progress: false

jobs:
  sign:
    name: Sign IPA with authorized Apple assets
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Download unsigned IPA from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input"
          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --pattern "*.ipa" \
            --dir "$RUNNER_TEMP/input"

          IPA_COUNT=$(find "$RUNNER_TEMP/input" -maxdepth 1 \
            -type f -name '*.ipa' | wc -l | tr -d ' ')

          if [ "$IPA_COUNT" != "1" ]; then
            echo "::error::The release must contain exactly one IPA."
            exit 1
          fi

      - name: Check signing secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$CERTIFICATE_BASE64" || {
            echo "::error::Missing APPLE_CERTIFICATE_BASE64"
            exit 1
          }

          test -n "$CERTIFICATE_PASSWORD" || {
            echo "::error::Missing APPLE_CERTIFICATE_PASSWORD"
            exit 1
          }

          test -n "$PROFILE_BASE64" || {
            echo "::error::Missing APPLE_PROFILE_BASE64"
            exit 1
          }

      - name: Import signing certificate and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERT="$RUNNER_TEMP/signing.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERT"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PROFILE"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings \
            -lut 1800 "$KEYCHAIN"
          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT" \
            -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security list-keychains \
            -d user -s "$KEYCHAIN"

          mkdir -p "$RUNNER_TEMP/profile"
          security cms -D -i "$PROFILE" \
            > "$RUNNER_TEMP/profile/profile.plist"

          echo "Signing certificate and provisioning profile imported."

      - name: Inspect IPA and verify bundle structure
        run: |
          set -euo pipefail

          IPA="$(find "$RUNNER_TEMP/input" -maxdepth 1 \
            -type f -name '*.ipa' | head -n 1)"

          mkdir -p "$RUNNER_TEMP/unpacked"
          ditto -x -k "$IPA" "$RUNNER_TEMP/unpacked"

          APP_COUNT=$(find "$RUNNER_TEMP/unpacked/Payload" \
            -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')

          if [ "$APP_COUNT" != "1" ]; then
            echo "::error::Expected exactly one app in Payload."
            exit 1
          fi

          APP="$(find "$RUNNER_TEMP/unpacked/Payload" \
            -maxdepth 1 -type d -name '*.app' | head -n 1)"

          if [ ! -f "$APP/Info.plist" ]; then
            echo "::error::App Info.plist is missing."
            exit 1
          fi

          /usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' "$APP/Info.plist"

          echo "app_path=$APP" >> "$GITHUB_ENV"

      - name: Stop until app-specific signing is configured
        run: |
          echo "::error::Preflight succeeded, but signing is not yet configured."
          echo "A valid profile must match the app bundle ID, certificate,"
          echo "device registration, and required entitlements."
          echo "Configure and verify those values before enabling signing."
          exit 1
