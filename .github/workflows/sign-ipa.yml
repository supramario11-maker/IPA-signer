
name: Build and Test Linux Omnisette Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Install Docker and dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl git unzip perl make \
            docker.io
          sudo systemctl start docker
          sudo docker --version

      - name: Download and extract required libraries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/omnisette/lib"
          cd "$RUNNER_TEMP/omnisette"

          curl --fail --location --retry 3 \
            "https://apps.mzstatic.com/content/android-apple-music-apk/applemusic.apk" \
            --output applemusic.apk

          unzip -o applemusic.apk \
            'lib/*/libstoreservicescore.so' \
            'lib/*/libCoreADI.so'

          rm applemusic.apk

          find . -type f \
            \( -name 'libstoreservicescore.so' \
            -o -name 'libCoreADI.so' \) -print

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version

      - name: Build upstream server
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/SideStore/omnisette-server.git \
            "$RUNNER_TEMP/omnisette-source"

          cd "$RUNNER_TEMP/omnisette-source"
          cargo build --release

      - name: Build Docker image
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/omnisette-source"

          sudo docker build \
            --tag omnisette-local:test .

      - name: Start container for a short test
        run: |
          set -euo pipefail

          sudo docker run -d \
            --name omnisette-test \
            -p 127.0.0.1:6969:80 \
            --volume omnisette_test_data:/opt/omnisette-server/lib \
            omnisette-local:test

          sleep 5
          sudo docker ps -a
          sudo docker logs omnisette-test

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/omnisette-diagnostics"
          sudo docker logs omnisette-test \
            > "$RUNNER_TEMP/omnisette-diagnostics/container.log" 2>&1 || true
          sudo docker inspect omnisette-test \
            > "$RUNNER_TEMP/omnisette-diagnostics/container-inspect.json" 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-server-diagnostics
          path: ${{ runner.temp }}/omnisette-diagnostics/
          if-no-files-found: warn

      - name: Clean up
        if: always()
        run: |
          sudo docker rm -f omnisette-test || true
          sudo docker volume rm omnisette_test_data || true
